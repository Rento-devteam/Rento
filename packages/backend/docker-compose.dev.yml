services:
  postgres:
    image: postgres:16-alpine
    container_name: rento-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: rento
    # Host 5434 avoids clashes with local PostgreSQL on 5432/5433.
    ports:
      - '5434:5432'
    volumes:
      - rento_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d rento']
      interval: 5s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.4
    container_name: rento-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - 'ES_JAVA_OPTS=-Xms512m -Xmx512m'
    ports:
      - '9200:9200'
    volumes:
      - rento_es_data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -sf http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s || exit 1',
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: rento-redis-dev
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - '6379:6379'
    volumes:
      - rento_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Llama via Ollama — listing text moderation (see docs/moderation-draft-ai.md).
  # Host 11435 avoids clashing with a native Ollama install on Windows/macOS (often :11434).
  ollama:
    image: ollama/ollama:latest
    container_name: rento-ollama-dev
    ports:
      - '11435:11434'
    volumes:
      - rento_ollama_data:/root/.ollama

volumes:
  rento_pg_data:
  rento_es_data:
  rento_redis_data:
  rento_ollama_data:
